name: release

# Push a tag vX.Y.Z (matching extension/manifest.json and a CHANGELOG.md
# section) to publish a GitHub release with the packaged extension.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # create the release
  id-token: write # sign the build provenance
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the manifest version
        run: |
          version=$(node -p 'require("./extension/manifest.json").version')
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME but manifest.json says $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: JavaScript parses
        run: for f in extension/*.js; do node --check "$f"; done

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '
            /^## \[|^\[[^]]+\]: / { if (found) exit; if (index($0, "## [" v "]") == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::no '## [$VERSION]' section in CHANGELOG.md"; exit 1; }

      - name: Package
        run: |
          zip_name="slack-vim-$VERSION.zip"
          (cd extension && zip -r -X "../$zip_name" .)
          sha256sum "$zip_name" > "$zip_name.sha256"
          echo "ZIP=$zip_name" >> "$GITHUB_ENV"

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ env.ZIP }}

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$ZIP" "$ZIP.sha256" --title "slack-vim $VERSION" --notes-file notes.md --verify-tag
